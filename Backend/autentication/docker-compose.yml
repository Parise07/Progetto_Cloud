# start-dev

#per attivare il nostro docker essere sicuri di essere nella cartella corretta e seguire comando:
# docker compose up

services:
  # andiamo a creare il service per runnare il keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: keycloack
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - 8080:8080 #abilitiamo il keycloack alla porta 8080


