name: Backend CI - Build & Push Docker

# Questa pipeline si attiva IN AUTOMATICO solo quando fai un push 
# sul branch 'main' e SOLO se modifichi file nella cartella del Backend.
on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**' # Assicurati che questo sia il nome esatto della tua cartella backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub ci presta un server Linux gratuito

    steps:
      - name: 📥 1. Checkout del codice sorgente
        uses: actions/checkout@v3

      - name: 🔑 2. Login su Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 3. Build e Push dell'immagine
        uses: docker/build-push-action@v4
        with:
          # Percorso della cartella dove si trova il tuo Dockerfile
          context: ./Backend 
          push: true
          # Tag dell'immagine (lo stesso che usava Azure)
          tags: parise09/newsarchive-backend:latest